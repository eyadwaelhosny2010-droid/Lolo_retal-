<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lolo & Retal ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 30px 20px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            line-height: 1.8;
        }

        .heart {
            font-size: 70px;
            margin: 20px;
        }

        .card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 20px;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            background: #ff4f81;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        #message {
            display: none;
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heart">❤️</div>

        <h1>Lolo & Retal</h1>

        <div class="card">
            <p>
                دي صفحة صغيرة مخصوص ليكي ❤️
                <br>
                عشان أقولك إنك شخص مميز جدًا عندي.
            </p>

            <button onclick="showMessage()">
                دوسي هنا ❤️
            </button>

            <div id="message">
                مهما حصل، هتفضلي دايمًا ليكي مكان مميز ❤️✨
            </div>
        </div>

    </div>

    <script>
        function showMessage() {
            document.getElementById("message").style.display = "block";
        }
    </script>

</body>
</html>
