<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lolo ❤️ Retal</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:linear-gradient(135deg,#160711,#3b1028,#160711);
    color:white;
    text-align:center;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:25px 15px;
}

.start{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

h1{
    font-size:48px;
    margin:15px;
}

h2{
    font-size:30px;
}

p{
    font-size:18px;
    line-height:2;
}

button{
    border:0;
    background:linear-gradient(135deg,#ff347d,#ff7aad);
    color:white;
    padding:16px 30px;
    border-radius:40px;
    font-size:19px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 10px 30px #ff347d55;
}

.card{
    background:#ffffff12;
    border:1px solid #ffffff20;
    border-radius:25px;
    padding:25px;
    margin:25px 0;
    backdrop-filter:blur(10px);
}

.hidden{
    display:none;
}

.heart{
    font-size:80px;
    animation:heart 1.2s infinite;
}

@keyframes heart{
    50%{
        transform:scale(1.15);
    }
}

.date{
    display:inline-block;
    padding:8px 18px;
    border-radius:30px;
    background:#ffffff15;
    color:#ffd6e5;
}

.counter{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.counter div{
    background:#00000035;
    padding:18px 5px;
    border-radius:18px;
}

.counter b{
    display:block;
    font-size:30px;
}

.counter span{
    color:#e8cbd7;
}

.love-list{
    display:grid;
    gap:12px;
}

.love-list div{
    padding:15px;
    background:#ff3f8617;
    border:1px solid #ff3f8630;
    border-radius:18px;
    font-size:18px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.gallery img{
    width:100%;
    height        .heart {
            font-size: 70px;
            margin: 20px;
        }

        .card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 20px;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            background: #ff4f81;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        #message {
            display: none;
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heart">❤️</div>

        <h1>Lolo & Retal</h1>

        <div class="card">
            <p>
                دي صفحة صغيرة مخصوص ليكي ❤️
                <br>
                عشان أقولك إنك شخص مميز جدًا عندي.
            </p>

            <button onclick="showMessage()">
                دوسي هنا ❤️
            </button>

            <div id="message">
                مهما حصل، هتفضلي دايمًا ليكي مكان مميز ❤️✨
            </div>
        </div>

    </div>

    <script>
        function showMessage() {
            document.getElementById("message").style.display = "block";
        }
    </script>

</body>
</html>
